services:
  - type: web
    name: somahome-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn somahome.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
